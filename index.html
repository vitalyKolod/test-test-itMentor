<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Калькулятор тестовое</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://kit.fontawesome.com/d2dca4761e.js" crossorigin="anonymous"></script>
  </head>
  <body>
    <div class="calculator">
      <input type="text" class="display" id="display" disabled />
      <div class="buttons">
        <button class="clear" onclick="clearDisplay()">С</button>
        <button onclick="deleteLast()"><i class="fa-solid fa-delete-left"></i></button>
        <button onclick="appendValue('00')">00</button>
        <button onclick="appendValue('0')">0</button>
        <button class="operator" onclick="appendValue('+')">
          <i class="fa-solid fa-plus"></i>
        </button>
        <button onclick="appendValue('7')">7</button>
        <button onclick="appendValue('8')">8</button>
        <button onclick="appendValue('9')">9</button>
        <button class="operator" onclick="appendValue('-')">
          <i class="fa-solid fa-minus"></i>
        </button>
        <button onclick="appendValue('4')">4</button>
        <button onclick="appendValue('5')">5</button>
        <button onclick="appendValue('6')">6</button>
        <button class="operator" onclick="appendValue('/')">
          <i class="fa-solid fa-divide"></i>
        </button>
        <button onclick="appendValue('1')">1</button>
        <button onclick="appendValue('2')">2</button>
        <button onclick="appendValue('3')">3</button>
        <button class="operator" onclick="appendValue('x')">
          <i class="fa-solid fa-xmark"></i>
        </button>
        <button onclick="appendValue('.')">.</button>
        <button class="equal" onclick="calculateResult()">
          <i class="fa-solid fa-equals"></i>
        </button>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
